# Testnivå 1 på hver push og pull request: ingen nøkkel, ingen ekte skjerm.
name: Nivå 1

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  niva1:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Systempakker (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb tesseract-ocr python3-tk
      - name: Installer Losen
        run: python -m pip install -e .
      - name: Nivå 1 (Linux, virtuell skjerm)
        if: runner.os == 'Linux'
        run: xvfb-run -a python tests/run_checks.py
      - name: Nivå 1 (Windows)
        if: runner.os == 'Windows'
        run: python tests/run_checks.py
